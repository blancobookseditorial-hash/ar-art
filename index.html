<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Blanco Books Editorial | Galeria AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;
    }

    #startScreen h1 {
      margin-bottom: 5px;
    }

    #startButton {
      margin-top: 25px;
      padding: 16px 28px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #instructions {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      text-align: center;
      width: 80%;
      max-width: 400px;
      display: none;
    }
  </style>
</head>

<body>

  <!-- Pantalla de inicio para el cliente -->
  <div id="startScreen">

    <h1>Blanco Books Editorial</h1>

    <p>
      Una experiencia en Realidad Aumentada<br>
      para nuestras obras
    </p>

    <button id="startButton">
      Iniciar experiencia AR
    </button>

    <p style="font-size:12px; opacity:0.7; margin-top:20px;">
      Permite el acceso a la camara cuando te lo pida.
    </p>

  </div>

  <!-- Instrucciones mientras busca -->
  <div id="instructions">
    Apunta la camara a uno de los cuadros
  </div>


  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

      <video
        id="videoIsla"
        src="./videos/anatomia-isla.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline>
      </video>

      <video
        id="videoSeths"
        src="./videos/seths-dreams.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- 0 - Anatomia de una Isla (horizontal) -->
    <a-entity
      id="targetIsla"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#videoIsla"
        position="0 0 0.01"
        width="1"
        height="0.75">
      </a-video>

    </a-entity>


    <!-- 1 - Seths Dreams (vertical) -->
    <a-entity
      id="targetSeths"
      mindar-image-target="targetIndex: 1">

      <a-video
        src="#videoSeths"
        position="0 0 0.01"
        width="1"
        height="1.25">
      </a-video>

    </a-entity>

  </a-scene>


  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const videoIsla =
        document.querySelector("#videoIsla");

      const videoSeths =
        document.querySelector("#videoSeths");

      const targetIsla =
        document.querySelector("#targetIsla");

      const targetSeths =
        document.querySelector("#targetSeths");

      const startButton =
        document.querySelector("#startButton");

      const startScreen =
        document.querySelector("#startScreen");

      const instructions =
        document.querySelector("#instructions");


      let experienceStarted = false;


      /*
       * El toque del cliente da permiso al navegador
       * para reproducir audio.
       */
      startButton.addEventListener("click", async () => {

        experienceStarted = true;

        videoIsla.muted = false;
        videoIsla.volume = 1;

        videoSeths.muted = false;
        videoSeths.volume = 1;

        /*
         * Arranca y pausa cada video de inmediato.
         * Esto desbloquea el audio en movil.
         */
        try {

          await videoIsla.play();
          videoIsla.pause();
          videoIsla.currentTime = 0;

        } catch (error) {

          console.log("Audio unlock (isla):", error);

        }

        try {

          await videoSeths.play();
          videoSeths.pause();
          videoSeths.currentTime = 0;

        } catch (error) {

          console.log("Audio unlock (seths):", error);

        }

        startScreen.style.display = "none";
        instructions.style.display = "block";

      });


      /*
       * Obra reconocida: Anatomia de una Isla
       */
      targetIsla.addEventListener("targetFound", () => {

        instructions.style.display = "none";

        if (experienceStarted) {

          videoIsla.play().catch(error => {
            console.log("Video isla:", error);
          });

        }

      });

      targetIsla.addEventListener("targetLost", () => {

        videoIsla.pause();

        if (experienceStarted) {
          instructions.style.display = "block";
        }

      });


      /*
       * Obra reconocida: Seths Dreams
       */
      targetSeths.addEventListener("targetFound", () => {

        instructions.style.display = "none";

        if (experienceStarted) {

          videoSeths.play().catch(error => {
            console.log("Video seths:", error);
          });

        }

      });

      targetSeths.addEventListener("targetLost", () => {

        videoSeths.pause();

        if (experienceStarted) {
          instructions.style.display = "block";
        }

      });

    });

  </script>

</body>
</html>
