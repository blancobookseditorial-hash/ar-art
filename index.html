<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Blanco Books Editorial | Galeria AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;
    }

    #startScreen h1 {
      margin-bottom: 5px;
    }

    #startButton {
      margin-top: 25px;
      padding: 16px 28px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #instructions {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      text-align: center;
      width: 80%;
      max-width: 400px;
      display: none;
    }
  </style>
</head>

<body>

  <div id="startScreen">

    <h1>Blanco Books Editorial</h1>

    <p>
      Una experiencia en Realidad Aumentada<br>
      para nuestras obras
    </p>

    <button id="startButton">
      Iniciar experiencia AR
    </button>

    <p style="font-size:12px; opacity:0.7; margin-top:20px;">
      Permite el acceso a la camara cuando te lo pida.
    </p>

  </div>

  <div id="instructions">
    Apunta la camara a uno de los cuadros
  </div>


  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

      <video
        id="videoIsla"
        src="./videos/anatomia-isla.mp4"
        preload="auto"
        loop muted
        playsinline
        webkit-playsinline>
      </video>

      <video
        id="videoSeths"
        src="./videos/seths-dreams.mp4"
        preload="auto"
        loop muted
        playsinline
        webkit-playsinline>
      </video>

      <video
        id="videoLunatico"
        src="./videos/lunatico.mp4"
        preload="auto"
        loop muted
        playsinline
        webkit-playsinline>
      </video>

      <video
        id="videoCielo"
        src="./videos/desplegando-cielo.mp4"
        preload="auto"
        loop muted
        playsinline
        webkit-playsinline>
      </video>

      <video
        id="videoNacimiento"
        src="./videos/nacimiento.mp4"
        preload="auto"
        loop muted
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- 0 - Anatomia de una Isla (horizontal) -->
    <a-entity
      id="targetIsla"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#videoIsla"
        position="0 0 0.01"
        width="1"
        height="0.75">
      </a-video>

    </a-entity>


    <!-- 1 - Seths Dreams (horizontal) -->
    <a-entity
      id="targetSeths"
      mindar-image-target="targetIndex: 1">

      <a-video
        src="#videoSeths"
        position="0 0 0.01"
        width="1"
        height="0.75">
      </a-video>

    </a-entity>


    <!-- 2 - Lunatico (vertical) -->
    <a-entity
      id="targetLunatico"
      mindar-image-target="targetIndex: 2">

      <a-video
        src="#videoLunatico"
        position="0 0 0.01"
        width="1"
        height="1.25">
      </a-video>

    </a-entity>


    <!-- 3 - Desplegando el Cielo (vertical) -->
    <a-entity
      id="targetCielo"
      mindar-image-target="targetIndex: 3">

      <a-video
        src="#videoCielo"
        position="0 0 0.01"
        width="1"
        height="1.25">
      </a-video>

    </a-entity>


    <!-- 4 - El Nacimiento (vertical) -->
    <a-entity
      id="targetNacimiento"
      mindar-image-target="targetIndex: 4">

      <a-video
        src="#videoNacimiento"
        position="0 0 0.01"
        width="1"
        height="1.25">
      </a-video>

    </a-entity>

  </a-scene>


  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const videos = [
        document.querySelector("#videoIsla"),
        document.querySelector("#videoSeths"),
        document.querySelector("#videoLunatico"),
        document.querySelector("#videoCielo"),
        document.querySelector("#videoNacimiento")
      ];

      const pares = [
        { target: document.querySelector("#targetIsla"),       video: document.querySelector("#videoIsla") },
        { target: document.querySelector("#targetSeths"),      video: document.querySelector("#videoSeths") },
        { target: document.querySelector("#targetLunatico"),   video: document.querySelector("#videoLunatico") },
        { target: document.querySelector("#targetCielo"),      video: document.querySelector("#videoCielo") },
        { target: document.querySelector("#targetNacimiento"), video: document.querySelector("#videoNacimiento") }
      ];

      const startButton =
        document.querySelector("#startButton");

      const startScreen =
        document.querySelector("#startScreen");

      const instructions =
        document.querySelector("#instructions");


      let experienceStarted = false;


      /*
       * Todos los videos quedan silenciados.
       * El toque del cliente solo da permiso al navegador
       * para arrancar la reproduccion.
       */
      startButton.addEventListener("click", () => {

        experienceStarted = true;

        videos.forEach(function (v) {
          if (!v) return;
          v.muted = true;
          v.volume = 0;
        });

        startScreen.style.display = "none";
        instructions.style.display = "block";

      });


      /*
       * Cada obra: reconocida y perdida
       */
      pares.forEach(function (par) {

        if (!par.target || !par.video) return;

        par.target.addEventListener("targetFound", () => {

          instructions.style.display = "none";

          if (experienceStarted) {

            par.video.play().catch(error => {
              console.log("Video playback:", error);
            });

          }

        });

        par.target.addEventListener("targetLost", () => {

          par.video.pause();

          if (experienceStarted) {
            instructions.style.display = "block";
          }

        });

      });

    });

  </script>

</body>
</html>
